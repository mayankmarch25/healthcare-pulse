name: Quality check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Guards against the old copy-paste problem returning.
      # If a page or the stylesheet balloons, this fails before Cloudflare
      # publishes anything.
      - name: Check page weight budget
        run: |
          FAIL=0
          for f in $(find dist -name 'edition-*.html'); do
            KB=$(( $(stat -c%s "$f") / 1024 ))
            if [ "$KB" -gt 120 ]; then echo "TOO BIG: $f = ${KB} KB (budget 120 KB)"; FAIL=1; fi
          done
          CSS=$(find dist/_astro -name '*.css' -exec stat -c%s {} + | awk '{s+=$1} END {print int(s/1024)}')
          echo "Shared CSS: ${CSS} KB (budget 120 KB)"
          if [ "$CSS" -gt 120 ]; then echo "CSS budget exceeded"; FAIL=1; fi
          exit $FAIL
