name: Quality check

# Cloudflare handles the actual deploying, watching this repo directly.
# This workflow is the guard rail: it builds the site and fails loudly if
# anything regresses, so you find out before readers do.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Guards against the copy-paste problem returning. If a page or the
      # stylesheet balloons, this goes red.
      - name: Page weight budget
        run: |
          FAIL=0
          for f in $(find dist -name 'edition-*.html'); do
            KB=$(( $(stat -c%s "$f") / 1024 ))
            if [ "$KB" -gt 120 ]; then echo "TOO BIG: $f = ${KB} KB (budget 120)"; FAIL=1; fi
          done
          CSS=$(find dist/_astro -name '*.css' -exec stat -c%s {} + | awk '{s+=$1} END {print int(s/1024)}')
          echo "Shared CSS: ${CSS} KB (budget 120)"
          if [ "$CSS" -gt 120 ]; then echo "CSS budget exceeded"; FAIL=1; fi
          exit $FAIL

      # Catches the two mistakes that actually shipped: Jekyll tags leaking
      # to visitors, and pages rendering without the site shell.
      - name: Sitemap points only at real pages
        run: |
          FAIL=0
          test -f dist/sitemap.xml || { echo "sitemap.xml missing"; exit 1; }
          grep -oP '(?<=<loc>)[^<]+' dist/sitemap.xml | while read -r U; do
            P="${U#https://mayankmadhur.in}"
            case "$P" in
              */) T="dist${P}index.html" ;;
              *)  T="dist${P}" ;;
            esac
            [ -f "$T" ] || { echo "sitemap 404: $U"; exit 1; }
          done
          echo "sitemap URLs: $(grep -c '<loc>' dist/sitemap.xml)"

      - name: No template leaks or broken pages
        run: |
          FAIL=0
          LEAK=$(grep -rlE '\{\{ *(site|page|post)\.|\{% *(for|if|assign)' dist --include='*.html' || true)
          if [ -n "$LEAK" ]; then echo "Jekyll template code leaked into: $LEAK"; FAIL=1; fi
          for f in $(find dist -name '*.html'); do
            if ! head -c 400 "$f" | grep -qi '<!DOCTYPE'; then echo "Not a full page: $f"; FAIL=1; fi
          done
          exit $FAIL
